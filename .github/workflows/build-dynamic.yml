name: Build Dynamic

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-2022

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install CMake
        uses: lukka/get-cmake@latest

      - name: Clone Geode SDK
        shell: pwsh
        run: |
          git clone --depth 1 https://github.com/geode-sdk/geode.git "$env:GITHUB_WORKSPACE\geode-sdk"

      - name: Configure project
        shell: pwsh
        env:
          GEODE_SDK_PATH: ${{ github.workspace }}\geode-sdk
        run: |
          cmake -B build -S . -DGEODE_SDK_PATH="$env:GEODE_SDK_PATH" -G "Visual Studio 17 2022" -A x64

      - name: Build project
        shell: pwsh
        run: |
          cmake --build build --config Release

      - name: Find built files
        shell: pwsh
        run: |
          Get-ChildItem -Path . -Recurse -Filter *.geode | Select-Object FullName
          Get-ChildItem -Path . -Recurse -Filter *.dll | Select-Object FullName

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Dynamic-geode
          path: |
            build/
