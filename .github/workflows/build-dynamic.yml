name: Build Dynamic

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install CMake
        uses: lukka/get-cmake@latest

      - name: Clone Geode SDK
        shell: bash
        run: |
          git clone --depth 1 https://github.com/geode-sdk/geode.git "$RUNNER_WORKSPACE/geode-sdk"

      - name: Configure project
        shell: bash
        env:
          GEODE_SDK_PATH: ${{ runner.workspace }}/geode-sdk
        run: |
          cmake -B build -S . -DGEODE_SDK_PATH="$GEODE_SDK_PATH" -G "Visual Studio 17 2022" -A x64

      - name: Build project
        shell: bash
        run: |
          cmake --build build --config Release

      - name: Look for output artifact
        shell: bash
        run: |
          find build -iname "*.geode" -o -iname "*.dll" -o -iname "*.pdb" | head -200

      - name: Upload .geode artifact
        uses: actions/upload-artifact@v4
        with:
          name: Dynamic-geode
          path: |
            build/Release/*.geode
            build/**/*.geode
